name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Semantic version segment to increment'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      custom_version:
        description: 'Custom version override (e.g. 3.5.0 or 4.0.0-beta.1 - optional, overrides bump_type)'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  ASSET_PREFIX: in.rahulja.materialhn

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.x'

      - name: Calculate Version Bump
        id: version_info
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          CUSTOM_VERSION: ${{ github.event.inputs.custom_version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUMP_ARGS="--type $BUMP_TYPE"
            if [ -n "$CUSTOM_VERSION" ]; then
              BUMP_ARGS="$BUMP_ARGS --custom-version $CUSTOM_VERSION"
            fi
            if ! BUMP_OUTPUT=$(python3 scripts/release_helper.py bump $BUMP_ARGS); then
              echo "::error::Version bump calculation failed"
              exit 1
            fi
            echo "$BUMP_OUTPUT"
            TAG=$(echo "$BUMP_OUTPUT" | grep "^BUMPED_TAG=" | cut -d'=' -f2)
            VERSION=$(echo "$BUMP_OUTPUT" | grep "^BUMPED_VERSION=" | cut -d'=' -f2)
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          else
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Verify tag matches version.properties
        id: version_check
        run: |
          set -euo pipefail
          TAG="${{ steps.version_info.outputs.tag }}"
          VERSION="${{ steps.version_info.outputs.version }}"
          FILES_VERSION="$(grep '^VERSION_MAJOR=' version.properties | cut -d= -f2).$(grep '^VERSION_MINOR=' version.properties | cut -d= -f2).$(grep '^VERSION_PATCH=' version.properties | cut -d= -f2)"
          if [ "$FILES_VERSION" != "$VERSION" ]; then
            echo "::error::Tag ${TAG} does not match version.properties (${FILES_VERSION}). Bump version.properties and tag again."
            exit 1
          fi
          CODE="$(grep '^VERSION_CODE=' version.properties | cut -d= -f2)"
          echo "Building ${FILES_VERSION} (${CODE}) from tag ${TAG}"
          echo "version_code=${CODE}" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@748248ddd2a24f49513d8f472f81c3a07d4d50e1 # v4.4.4

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build release APK
        env:
          KEY_STORE_BASE64: ${{ secrets.KEY_STORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: |
          ./gradlew assembleRelease \
            -PversionCode=${{ steps.version_check.outputs.version_code }} \
            -PversionName=${{ steps.version_info.outputs.version }} \
            --console=plain

      - name: Package and verify release assets
        id: package_assets
        run: |
          set -euo pipefail
          TAG="${{ steps.version_info.outputs.tag }}"
          APK_DIR="app/build/outputs/apk/release"
          if [ -f "${APK_DIR}/app-release.apk" ]; then
            ASSET="${ASSET_PREFIX}-${TAG}.apk"
            cp "${APK_DIR}/app-release.apk" "${APK_DIR}/${ASSET}"
            APKSIGNER="$(ls -d "${ANDROID_HOME}"/build-tools/*/apksigner | sort -V | tail -1)"
            "${APKSIGNER}" verify --print-certs "${APK_DIR}/${ASSET}" | head -5
          elif [ -f "${APK_DIR}/app-release-unsigned.apk" ]; then
            echo "::error::Release APK is unsigned. Configure KEY_STORE_BASE64, KEY_STORE_PASSWORD, KEY_ALIAS and KEY_PASSWORD."
            exit 1
          else
            echo "::error::No release APK found in ${APK_DIR}."
            exit 1
          fi
          cd "${APK_DIR}"
          sha256sum "${ASSET}" > sha256sum.txt
          cat sha256sum.txt

      - name: Commit and push version bump and tag
        if: github.event_name == 'workflow_dispatch'
        env:
          TAG: ${{ steps.version_info.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add version.properties
          git commit -m "chore(release): release ${TAG} [skip ci]"
          git tag -a "${TAG}" -m "Release ${TAG}"
          if [ "${{ github.ref_type }}" = "branch" ]; then
            git push origin HEAD:"${{ github.ref_name }}"
          fi
          git push origin "${TAG}"

      - name: Generate release notes
        run: |
          python3 scripts/release_helper.py changelog \
            --curr-tag "${{ steps.version_info.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --apk-dir "app/build/outputs/apk/release" \
            --output "RELEASE_CHANGELOG.md"

      - name: Upload APK
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: release-apks
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/sha256sum.txt

      - name: Upload R8 mapping
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: r8-mapping
          path: app/build/outputs/mapping/release/mapping.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ steps.version_info.outputs.tag }}
          name: Release ${{ steps.version_info.outputs.tag }}
          body_path: RELEASE_CHANGELOG.md
          make_latest: true
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/sha256sum.txt
            app/build/outputs/mapping/release/mapping.txt
