name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Semantic version segment to increment'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
      custom_version:
        description: 'Custom version override (e.g. 3.5.0 - optional, overrides bump_type if specified)'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Determine & Bump Version
        id: version_info
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          CUSTOM_VERSION: ${{ github.event.inputs.custom_version }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            BUMP_ARGS="--type $BUMP_TYPE"
            if [ -n "$CUSTOM_VERSION" ]; then
              BUMP_ARGS="$BUMP_ARGS --custom-version $CUSTOM_VERSION"
            fi
            
            # Execute bump and capture outputs
            if ! BUMP_OUTPUT=$(python3 scripts/release_helper.py bump $BUMP_ARGS); then
              echo "::error::Version bump calculation failed"
              exit 1
            fi
            echo "$BUMP_OUTPUT"
            
            TAG=$(echo "$BUMP_OUTPUT" | grep "^BUMPED_TAG=" | cut -d'=' -f2)
            VERSION=$(echo "$BUMP_OUTPUT" | grep "^BUMPED_VERSION=" | cut -d'=' -f2)
            
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add version.properties
            git commit -m "chore(release): release ${TAG} [skip ci]"
            git tag -a "${TAG}" -m "Release ${TAG}"
            git push origin HEAD:${{ github.ref_name }}
            git push origin "${TAG}"
            
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          else
            TAG="${{ github.ref_name }}"
            VERSION="${TAG#v}"
            # Sync version.properties for build without unnecessary code bump
            python3 scripts/release_helper.py bump --custom-version "$VERSION" || true
            echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build release APK
        env:
          KEY_STORE_BASE64: ${{ secrets.KEY_STORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Package & Prepare Release Assets
        id: package_assets
        run: |
          TAG="${{ steps.version_info.outputs.tag }}"
          APK_DIR="app/build/outputs/apk/release"
          
          # Rename/copy release APK to standard release naming
          if [ -f "${APK_DIR}/app-release.apk" ]; then
            cp "${APK_DIR}/app-release.apk" "${APK_DIR}/materialisheep-${TAG}.apk"
          elif [ -f "${APK_DIR}/app-release-unsigned.apk" ]; then
            cp "${APK_DIR}/app-release-unsigned.apk" "${APK_DIR}/materialisheep-${TAG}.apk"
          fi
          
          # Generate SHA-256 checksums file
          (cd "${APK_DIR}" && sha256sum materialisheep-${TAG}.apk > sha256sum.txt)

      - name: Generate Release Notes & Changelog
        run: |
          python3 scripts/release_helper.py changelog \
            --curr-tag "${{ steps.version_info.outputs.tag }}" \
            --repo "${{ github.repository }}" \
            --apk-dir "app/build/outputs/apk/release" \
            --output "RELEASE_CHANGELOG.md"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: materialisheep-${{ steps.version_info.outputs.tag }}-apks
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version_info.outputs.tag }}
          name: Release ${{ steps.version_info.outputs.tag }}
          body_path: RELEASE_CHANGELOG.md
          make_latest: true
          files: |
            app/build/outputs/apk/release/materialisheep-*.apk
            app/build/outputs/apk/release/sha256sum.txt
