plugins {
    alias(libs.plugins.android.application)
    alias(libs.plugins.ksp)
}

def versionPropsFile = rootProject.file("version.properties")
def versionProps = new Properties()
if (versionPropsFile.canRead()) {
    versionPropsFile.withInputStream { is -> versionProps.load(is) }
}
def verMajor = versionProps['VERSION_MAJOR'] ?: "3"
def verMinor = versionProps['VERSION_MINOR'] ?: "4"
def verPatch = versionProps['VERSION_PATCH'] ?: "13"
def verCode = (versionProps['VERSION_CODE'] ?: "93").toInteger()
def verName = "${verMajor}.${verMinor}.${verPatch}"

android {
    compileSdk 36

    defaultConfig {
        applicationId "io.github.sheepdestroyer.materialisheep"
        minSdk = 31
        targetSdk = 36
        versionCode verCode
        def gitHash = { ->
            try {
                def hash = "git rev-parse --short HEAD".execute().text.trim()
                return hash.isEmpty() ? "unknown" : hash
            } catch (Exception e) {
                "unknown"
            }
        }()
        versionName verName
        buildConfigField "String", "GIT_HASH", "\"${gitHash}\""
        buildConfigField "int", "LATEST_RELEASE", "${verCode}"
        buildConfigField "String", "GITHUB_TOKEN", "\"\""
        proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                'proguard-rules.pro',
                'proguard-square.pro',
                'proguard-support.pro',
                'proguard-rx.pro'
        resConfigs 'en', 'zh-rCN', 'es'
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    signingConfigs {
        release {}
    }

    def keystoreBase64 = System.getenv("KEY_STORE_BASE64")
    def keystorePassword = System.getenv("KEY_STORE_PASSWORD")
    def keyAlias = System.getenv("KEY_ALIAS")
    def keyPassword = System.getenv("KEY_PASSWORD")

    if (keystoreBase64?.trim() && keystorePassword?.trim() && keyAlias?.trim() && keyPassword?.trim()) {
        def keystoreFile = rootProject.file(".gradle/release.jks")
        keystoreFile.parentFile.mkdirs()
        keystoreFile.bytes = keystoreBase64.decodeBase64()

        signingConfigs.release.storeFile = keystoreFile
        signingConfigs.release.storePassword = keystorePassword
        signingConfigs.release.keyAlias = keyAlias
        signingConfigs.release.keyPassword = keyPassword
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            minifyEnabled true
            shrinkResources true
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
        }
    }
    lint {
        htmlReport false
        xmlReport false
        textReport true
        lintConfig file("${rootProject.getRootDir()}/lint.xml")
        abortOnError true
        explainIssues false
        absolutePaths false
        disable += 'NullSafeMutableLiveData'
    }
    packaging {
        resources {
            excludes += "/META-INF/{AL2.0,LGPL2.1}"
            excludes += "/META-INF/versions/9/OSGI-INF/MANIFEST.MF"
        }
    }

    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }
    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.compilerArgs << "-Xlint:deprecation"
    }
    kotlin {
        jvmToolchain {
            languageVersion.set(JavaLanguageVersion.of(21))
            vendor.set(JvmVendorSpec.ADOPTIUM)
        }
    }
    namespace 'io.github.sheepdestroyer.materialisheep'

}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
    implementation libs.androidx.appcompat
    implementation libs.androidx.recyclerview
    implementation libs.androidx.cardview
    implementation libs.androidx.swiperefreshlayout
    implementation libs.material
    implementation libs.androidx.preference.ktx
    implementation libs.androidx.browser
    implementation libs.jsoup
    implementation libs.dagger
    implementation libs.retrofit
    implementation libs.retrofit.converter.gson
    implementation libs.retrofit.adapter.rxjava3
    implementation libs.okhttp
    implementation libs.okhttp.logging.interceptor
    implementation libs.rxandroid
    implementation libs.rxjava
    implementation libs.androidx.room.runtime
    implementation libs.androidx.lifecycle.viewmodel.ktx
    implementation libs.androidx.lifecycle.livedata.ktx
    implementation platform(libs.kotlin.bom)
    implementation libs.kotlin.stdlib

    ksp libs.androidx.room.compiler
    ksp libs.dagger.compiler
    kspTest libs.androidx.room.compiler
    kspTest libs.dagger.compiler
    testImplementation libs.junit
    testImplementation libs.mockito.core
    testImplementation libs.robolectric
    testImplementation libs.androidx.test.core
    androidTestImplementation libs.androidx.test.ext.junit
    androidTestImplementation libs.androidx.test.rules
    androidTestImplementation libs.androidx.test.espresso.core
    coreLibraryDesugaring libs.desugar.jdk.libs
}
